[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transformerlab-mcp"
version = "0.1.0"
description = "MCP server for Transformerlab"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]",
    "transformerlab-client",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "isort",
]
